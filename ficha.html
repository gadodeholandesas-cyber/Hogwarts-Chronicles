<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha de Personagem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f1eef6;--panel:#fff;--ink:#1d1a2b;--muted:#6a6580;--line:#d9d3e6;--hp:#c0392b;--shield:#3f7fbf;--accent:#c0392b;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--panel:#1e1b3a;--ink:#efeaf8;--muted:#a49fc0;--line:#363158}}
:root[data-theme="dark"]{--bg:#14122a;--panel:#1e1b3a;--ink:#efeaf8;--muted:#a49fc0;--line:#363158}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Alegreya Sans',system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font:700 2.4rem/1.1 'Cormorant Garamond',Georgia,serif;margin:0 0 4px;color:var(--accent);transition:color .3s}
.sub{color:var(--muted);margin:0 0 24px}
section{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:18px;margin-bottom:18px;transition:border-color .3s}
h2{font:700 1.4rem 'Cormorant Garamond',Georgia,serif;margin:0 0 12px}
.bar{margin-bottom:16px}
.bar:last-child{margin-bottom:0}
.bhead{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.bhead span{font-variant-numeric:tabular-nums}
.track{height:22px;background:var(--bg);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:6px 0 8px}
.fill{height:100%;transition:width .35s ease}
#hpfill{background:var(--hp)}#shfill{background:var(--shield)}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
.ctl button{flex:1 1 56px;min-height:44px;font:700 1rem inherit;font-family:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer}
.ctl button:hover{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label.f{display:block;font-weight:700;font-size:.95rem;margin-bottom:4px}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}
textarea{min-height:140px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:700;font-size:.95rem;margin-bottom:6px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{padding:9px 14px;border:1px solid var(--line);border-radius:20px;background:var(--bg);cursor:pointer;min-height:44px;display:flex;align-items:center}
.chips input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
.chips input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.act{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.act button{min-height:44px;padding:0 18px;font:700 1rem inherit;font-family:inherit;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on);cursor:pointer}
.act button.alt{background:transparent;color:var(--ink);border-color:var(--line)}
#msg{color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<h1 id="title">Ficha de Personagem</h1>
<p class="sub">Preencha sua ficha e acompanhe sua vida e seu escudo durante o jogo. Tudo é salvo automaticamente neste aparelho.</p>

<section>
<h2>Estado</h2>
<div class="bar">
<div class="bhead"><label for="hpnum">Vida</label><span id="hptxt">100 / 100</span></div>
<div class="track"><div class="fill" id="hpfill" style="width:100%"></div></div>
<div class="ctl" data-bar="hp">
<button type="button" data-d="-10">−10</button><button type="button" data-d="-1">−1</button>
<button type="button" data-d="1">+1</button><button type="button" data-d="10">+10</button>
</div>
</div>
<div class="bar">
<div class="bhead"><label>Escudo</label><span id="shtxt">100 / 100</span></div>
<div class="track"><div class="fill" id="shfill" style="width:100%"></div></div>
<div class="ctl" data-bar="sh">
<button type="button" data-d="-10">−10</button><button type="button" data-d="-1">−1</button>
<button type="button" data-d="1">+1</button><button type="button" data-d="10">+10</button>
</div>
</div>
</section>

<section>
<h2>Identidade</h2>
<div class="grid">
<div><label class="f" for="nome">Nome</label><input type="text" id="nome" autocomplete="off"></div>
<div><label class="f" for="sobrenome">Sobrenome</label><input type="text" id="sobrenome" autocomplete="off"></div>
<div><label class="f" for="idade">Idade</label><input type="text" id="idade" autocomplete="off" inputmode="numeric"></div>
<div><label class="f" for="pais">País de origem</label><input type="text" id="pais" autocomplete="off"></div>
<div><label class="f" for="linhagem">Linhagem</label>
<select id="linhagem"><option value="">Escolha…</option><option>Puro-sangue</option><option>Mestiço</option><option>Nascido trouxa</option></select></div>
<div><label class="f" for="animal">Animal</label><input type="text" id="animal" autocomplete="off"></div>
<div class="full"><label class="f" for="casa">Casa</label>
<select id="casa"><option value="">Escolha…</option><option>Grifinória</option><option>Corvinal</option><option>Sonserina</option><option>Lufa-Lufa</option></select></div>
</div>
</section>

<section>
<h2>Habilidades</h2>
<fieldset style="margin-bottom:16px"><legend>Perícia (escolha uma)</legend>
<div class="chips" id="pericia"></div></fieldset>
<fieldset><legend>Atributo (escolha um)</legend>
<div class="chips" id="atributo"></div></fieldset>
</section>

<section>
<h2>História</h2>
<label class="f" for="historia">Conte quem é o seu personagem</label>
<textarea id="historia"></textarea>
</section>

<div class="act">
<button type="button" id="copy">Copiar ficha</button>
<button type="button" class="alt" id="reset">Limpar ficha</button>
<span id="msg" role="status"></span>
</div>
</div>

<script>
var HOUSES={'Grifinória':['#c0392b','#fff'],'Corvinal':['#3b6fc4','#fff'],'Sonserina':['#2e8b57','#fff'],'Lufa-Lufa':['#d4a017','#1a1a1a']};
var PER=['Feitiços','Poções','Criaturas Mágicas','Reflexos mágicos','Vontade Inabalável'];
var ATR=['Resistência','Percepção','Lábia','Empatia'];
var KEY='ficha-rpg-v1';
var TXT=['nome','sobrenome','idade','pais','animal','historia'];
var S={hp:100,sh:100,nome:'',sobrenome:'',idade:'',pais:'',animal:'',historia:'',linhagem:'',casa:'',pericia:'',atributo:''};
function $(i){return document.getElementById(i)}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);for(var k in S)if(k in o)S[k]=o[k]}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function clamp(v){return Math.max(0,Math.min(100,v))}
function chips(id,list,name){
  var h='';list.forEach(function(t,i){var c=name+i;
    h+='<span><input type="radio" name="'+name+'" id="'+c+'" value="'+t+'"><label for="'+c+'">'+t+'</label></span>'});
  $(id).innerHTML=h;
  $(id).addEventListener('change',function(e){S[name]=e.target.value;save()});
}
function theme(){
  var h=HOUSES[S.casa]||['#7a5bd0','#fff'],r=document.documentElement.style;
  r.setProperty('--accent',h[0]);r.setProperty('--on',h[1]);
  $('title').textContent=S.casa?'Ficha de '+S.casa:'Ficha de Personagem';
}
function bars(){
  $('hptxt').textContent=S.hp+' / 100';$('hpfill').style.width=S.hp+'%';
  $('shtxt').textContent=S.sh+' / 100';$('shfill').style.width=S.sh+'%';
}
function paint(){
  TXT.forEach(function(k){$(k).value=S[k]});
  $('linhagem').value=S.linhagem;$('casa').value=S.casa;
  [['pericia',PER],['atributo',ATR]].forEach(function(p){
    p[1].forEach(function(t,i){$(p[0]+i).checked=(S[p[0]]===t)})});
  bars();theme();
}
chips('pericia',PER,'pericia');chips('atributo',ATR,'atributo');
load();paint();
TXT.forEach(function(k){$(k).addEventListener('input',function(){S[k]=$(k).value;save()})});
['linhagem','casa'].forEach(function(k){$(k).addEventListener('change',function(){S[k]=$(k).value;save();theme()})});
document.querySelectorAll('.ctl').forEach(function(c){
  c.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    var k=c.dataset.bar;S[k]=clamp(S[k]+parseInt(b.dataset.d,10));bars();save()})});
function note(t){$('msg').textContent=t;setTimeout(function(){$('msg').textContent=''},2500)}
$('copy').addEventListener('click',function(){
  var t='Ficha de '+S.nome+' '+S.sobrenome+'\nIdade: '+S.idade+'\nPaís de origem: '+S.pais+'\nLinhagem: '+S.linhagem+'\nAnimal: '+S.animal+'\nCasa: '+S.casa+'\nPerícia: '+S.pericia+'\nAtributo: '+S.atributo+'\nVida: '+S.hp+'/100\nEscudo: '+S.sh+'/100\n\nHistória:\n'+S.historia;
  try{navigator.clipboard.writeText(t).then(function(){note('Ficha copiada.')},function(){note('Não foi possível copiar.')})}catch(e){note('Não foi possível copiar.')}
});
$('reset').addEventListener('click',function(){
  if(!confirm('Apagar todos os dados da ficha?'))return;
  S={hp:100,sh:100,nome:'',sobrenome:'',idade:'',pais:'',animal:'',historia:'',linhagem:'',casa:'',pericia:'',atributo:''};
  save();paint();note('Ficha limpa.');
});
</script>
</body>
</html>
