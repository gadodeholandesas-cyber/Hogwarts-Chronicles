<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha RPG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f1eef6;--panel:#fff;--ink:#1d1a2b;--muted:#6a6580;--line:#d9d3e6;--hp:#c0392b;--shield:#3f7fbf;--accent:#7a5bd0;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--panel:#1e1b3a;--ink:#efeaf8;--muted:#a49fc0;--line:#363158}}
:root[data-theme="dark"]{--bg:#14122a;--panel:#1e1b3a;--ink:#efeaf8;--muted:#a49fc0;--line:#363158}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Alegreya Sans',system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 2.2rem/1.1 'Cormorant Garamond',Georgia,serif;margin:0 0 14px;color:var(--accent);transition:color .3s}
h2{font:700 1.4rem 'Cormorant Garamond',Georgia,serif;margin:0 0 10px}
section,.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:16px;margin-bottom:16px;transition:border-color .3s}
.bar{margin-bottom:12px}.bar:last-child{margin-bottom:0}
.bhead{display:flex;justify-content:space-between;font-weight:700}
.track{height:20px;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:5px 0 7px}
.fill{height:100%;transition:width .35s ease}
#hpfill{background:var(--hp)}#shfill{background:var(--shield)}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
button{font:700 1rem inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.ctl button{flex:1 1 52px;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:6px}
.ctl button:hover{border-color:var(--accent)}
.vr{display:flex;gap:6px;flex-wrap:wrap}
.vr input{flex:1 1 90px;min-width:0}
.vr button{flex:1 1 110px;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:6px}
.vr button:hover{border-color:var(--accent)}
.vr button.dmg:hover{border-color:var(--hp)}
.tabs{display:flex;gap:6px;margin:0 0 16px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;min-height:46px;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label.f,legend{display:block;font-weight:700;font-size:.95rem;margin-bottom:4px;padding:0}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}
textarea{min-height:130px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
fieldset{border:0;padding:0;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{padding:9px 14px;border:1px solid var(--line);border-radius:20px;background:var(--bg);cursor:pointer;min-height:44px;display:flex;align-items:center}
.chips input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
.chips input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.cat{--c:#c0392b;border-top-color:var(--c)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.top h2{margin:0}.badge{color:var(--c)}.xp{font-weight:700;font-variant-numeric:tabular-nums}
.next{color:var(--muted);margin:2px 0 10px;font-size:.95rem}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg .t{height:18px;background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg .f{height:100%;background:var(--c);width:0;transition:width .35s ease}
.seg small{display:block;margin-top:3px;font-size:.75rem;line-height:1.2;color:var(--muted)}
.seg.on small{color:var(--ink);font-weight:700}
.cat .ctl{margin:12px 0}
.cat .ctl button:hover{border-color:var(--c)}
.cat .ctl .minus{flex:0 0 54px;color:var(--muted)}
.lv{border-left:3px solid var(--line);padding:5px 0 5px 12px;margin-top:8px}
.lv h3{margin:0;font-size:1rem}.lv p{margin:2px 0 0}
.lv.open{border-left-color:var(--c)}.lv.lock{opacity:.55}.lv.cur{background:var(--bg);border-radius:0 6px 6px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center}
.stat b{display:block;font:700 2.4rem/1 'Cormorant Garamond',Georgia,serif;color:var(--accent)}
.stat small{color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:520px){.row{grid-template-columns:1fr 1fr}}
.act{min-height:48px;padding:6px 10px;border:1px solid var(--accent);background:var(--accent);color:var(--on);border-radius:6px}
.act.alt{background:transparent;color:var(--ink)}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 10px}
.free{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
#res{min-height:72px;font-size:1.1rem}
#res .big{font:700 2.2rem/1 'Cormorant Garamond',Georgia,serif;color:var(--accent)}
.ok{color:#2e8b57;font-weight:700}.no{color:var(--hp);font-weight:700}
#log{list-style:none;margin:10px 0 0;padding:0}
#log li{border-top:1px solid var(--line);padding:7px 0;font-size:.95rem}
.small{min-height:44px;padding:0 16px;border:1px solid var(--line);background:transparent;border-radius:6px}
.at{width:100%;border-collapse:collapse;font-size:.95rem}
.at th,.at td{text-align:left;padding:6px 8px;border-top:1px solid var(--line)}
.at th{color:var(--muted);font-size:.85rem;border-top:0}
.at td:nth-child(2){white-space:nowrap}
.at td:nth-child(3){color:var(--muted)}
.xb{display:flex;gap:4px;margin-top:6px}
.xb button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:6px}
.xb button:hover{border-color:var(--accent)}
.fr{display:flex;gap:6px;flex-wrap:wrap}
.fr input{flex:1 1 140px;min-width:0}
.fr button{min-height:44px;padding:0 18px;border:1px solid var(--accent);background:var(--accent);color:var(--on);border-radius:6px}
.ac{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:12px 0}
.ac button{min-height:44px;padding:4px 8px;border:1px solid var(--line);background:var(--bg);border-radius:6px}
.ac button:hover{border-color:var(--accent)}
.fo{display:flex;gap:8px;margin-bottom:8px}
.fo button{min-height:44px;padding:0 14px;border:1px solid var(--line);background:transparent;border-radius:6px;color:var(--muted)}
.ct{margin:0 0 4px}
.ac.neg button:hover{border-color:var(--hp)}
.fx{margin-bottom:10px}
.fx button[data-op=sub]{background:transparent;color:var(--ink);border-color:var(--line)}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<h1 id="title">Ficha RPG</h1>

<section>
<div class="bar"><div class="bhead"><span>Vida</span><span id="hptxt"></span></div>
<div class="track"><div class="fill" id="hpfill"></div></div>
<div class="vr" data-bar="hp"><input type="number" min="0" inputmode="numeric" placeholder="Valor" aria-label="Valor de vida"><button type="button" class="dmg" data-m="-1">Sofrer dano</button><button type="button" data-m="1">Curar</button></div></div>
<div class="bar"><div class="bhead"><span>Escudo</span><span id="shtxt"></span></div>
<div class="track"><div class="fill" id="shfill"></div></div>
<div class="vr" data-bar="sh"><input type="number" min="0" inputmode="numeric" placeholder="Valor" aria-label="Valor de escudo"><button type="button" class="dmg" data-m="-1">Sofrer dano</button><button type="button" data-m="1">Recuperar</button></div></div>
</section>

<div class="tabs" role="tablist">
<button type="button" role="tab" id="t0" aria-selected="true" aria-controls="p0">Personagem</button>
<button type="button" role="tab" id="t1" aria-selected="false" aria-controls="p1">Progressão</button>
<button type="button" role="tab" id="t2" aria-selected="false" aria-controls="p2">Combate</button>
<button type="button" role="tab" id="t3" aria-selected="false" aria-controls="p3">Amizades</button>
</div>

<div id="p0" role="tabpanel" aria-labelledby="t0">
<section><h2>Identidade</h2><div class="grid">
<div><label class="f" for="nome">Nome</label><input type="text" id="nome" autocomplete="off"></div>
<div><label class="f" for="sobrenome">Sobrenome</label><input type="text" id="sobrenome" autocomplete="off"></div>
<div><label class="f" for="idade">Idade</label><input type="text" id="idade" inputmode="numeric" autocomplete="off"></div>
<div><label class="f" for="pais">País de origem</label><input type="text" id="pais" autocomplete="off"></div>
<div><label class="f" for="linhagem">Linhagem</label><select id="linhagem"><option value="">Escolha…</option><option>Puro-sangue</option><option>Mestiço</option><option>Nascido trouxa</option></select></div>
<div><label class="f" for="animal">Animal</label><input type="text" id="animal" autocomplete="off"></div>
<div class="full"><label class="f" for="casa">Casa</label><select id="casa"><option value="">Escolha…</option><option>Grifinória</option><option>Corvinal</option><option>Sonserina</option><option>Lufa-Lufa</option></select></div>
</div></section>
<section><h2>Habilidades</h2>
<fieldset><legend>Perícia (escolha uma)</legend><div class="chips" id="pericia"></div></fieldset>
<fieldset style="margin:0"><legend>Atributo (escolha um)</legend><div class="chips" id="atributo"></div></fieldset></section>
<section><h2>História</h2><label class="f" for="historia">Conte quem é o seu personagem</label><textarea id="historia"></textarea></section>
<button type="button" class="small" id="copy">Copiar ficha</button> <button type="button" class="small" id="reset">Limpar tudo</button> <span id="msg" role="status" style="color:var(--muted)"></span>
</div>

<div id="p1" role="tabpanel" aria-labelledby="t1" hidden>
<p class="hint">Some XP cada vez que usar um feitiço ou preparar uma poção.</p>
<div id="cats"></div>
</div>

<div id="p3" role="tabpanel" aria-labelledby="t3" hidden>
<section><h2>Adicionar personagem</h2><div class="fr"><input type="text" id="fnome" placeholder="Nome" autocomplete="off" aria-label="Nome do personagem"><button type="button" id="fadd">Adicionar</button></div></section>
<div id="fl"></div>
</div>

<div id="p2" role="tabpanel" aria-labelledby="t2" hidden>
<div class="stats" id="attrs">




</div>


<div style="margin:-6px 0 16px"><button type="button" class="small" id="zex">Zerar extras</button></div>
<section><h2>Feitiço ofensivo</h2><p class="hint" id="ofeinfo"></p>
<div class="row"><button type="button" class="act" data-a="hit">Acertar<br>d10+ATQ</button><button type="button" class="act" data-a="dmg">Dano<br>d10+SPL</button></div></section>

<section><h2>Feitiço defensivo</h2><p class="hint" id="definfo"></p>
<div class="row"><button type="button" class="act" data-a="blk">Bloquear<br>d10+DEF</button><button type="button" class="act" data-a="ctr">Contra-atacar<br>d10+DEF</button><button type="button" class="act" data-a="dge">Desviar<br>d10+DEF</button></div></section>

<section><h2>Poção</h2><p class="hint" id="pocinfo"></p>
<div class="row"><button type="button" class="act" data-a="pot">Criar poção<br>d10+POT</button></div></section>

<section><h2>Testes</h2>
<div class="row"><button type="button" class="act" data-a="conv">Convencimento<br>d10+LBA</button><button type="button" class="act" data-a="perc">Percepção<br>d10+PCP</button></div></section>

<section><h2>Dado livre</h2>
<div class="free"><div><label class="f" for="fq">Quantidade</label><input type="number" id="fq" min="1" max="50" value="1"></div>
<div><label class="f" for="ff">Faces (dN)</label><input type="number" id="ff" min="2" max="1000" value="20"></div>
<div><label class="f" for="fm">Somar</label><input type="number" id="fm" value="0"></div></div>
<div class="chips" id="presets" style="margin-bottom:10px"></div>
<button type="button" class="act" data-a="free" style="width:100%">Rolar</button></section>

<section aria-live="polite"><h2>Resultado</h2><div id="res">Faça uma rolagem.</div><button type="button" class="act" id="retry" hidden style="margin-top:10px;width:100%">Usar 2ª tentativa</button><ul id="log"></ul>
<button type="button" class="small" id="clog" style="margin-top:8px">Limpar histórico</button></section>
</div>
</div>

<script>
var NIV=['Aprendiz','Intermediário','Avançado','Mestre'],FAIXA=['0–24','25–74','75–179','180+'],LIM=[25,75,180];
var CATS=[
{id:'ofe',nome:'Feitiços ofensivos',cor:'#c0392b',n:['Você não acerta tudo com muita precisão. Precisa tirar 5+ pra acertar.','Aumenta sua precisão. Precisa tirar 3+ pra acertar. Em disputas de poder, você ganha +1.','Sua precisão é quase impecável. Precisa tirar 2+ pra acertar. Em disputas de poder, você ganha +2.','Você dá 1/2 de dano a mais em feitiços ofensivos. Em disputas de poder, você ganha +3.']},
{id:'def',nome:'Feitiços defensivos',cor:'#3b6fc4',n:['Você não contra-ataca com tanta facilidade. Precisa tirar 10 pra repelir dano.','Contra-ataque melhorado. Precisa tirar 8+ pra repelir o dano. Escudo ativo tem 25 de durabilidade. Ganha +1 em esquiva.','Você repele dano mais facilmente. Precisa tirar 6+ pra repelir o dano. Escudo ativo tem 50 de durabilidade. Ganha +2 em esquiva.','Consegue adicionar 1/4 de dano em contra-ataques. Escudo ativo tem 100 de durabilidade. Ganha +3 em esquiva.']},
{id:'tra',nome:'Transfiguração',cor:'#8a56c9',n:['Sabe mudar a cor e posição de objetos pequenos. As transformações em animais e pessoas duram só por um curto período de tempo.','As transformações duram por mais tempo e agora podem transformar objetos médios com facilidade.','Permite transfigurar objetos grandes com facilidade e pode executar transfigurações difíceis.','Agora pode executar magias avançadas e muda todo tipo de objeto não encantado com facilidade. O tempo das transformações só depende do usuário ou de o alvo ser revertido por outro usuário. Quase liberdade total.']},
{id:'poc',nome:'Poções',cor:'#2e8b57',n:['Precisa tirar 10 para criar uma poção ótima e 6+ pra criar uma poção boa. Poções ótimas aumentam 1 turno de efeito.','Precisa tirar 8+ para criar uma poção ótima. Poções ótimas aumentam 1 turno de efeito.','Precisa tirar 7+ para criar uma poção ótima e 4+ para criar uma poção boa. Poções ótimas aumentam 1 turno de efeito.','As poções ótimas têm o dobro do efeito.']},
{id:'ele',nome:'Elementos',cor:'#d9822b',n:['Consegue manter um feitiço de feixe por 2 turnos.','Consegue manter um feitiço de feixe por 3 turnos.','Pode combinar elementos e mudar o alvo em feitiços de feixe elemental.','Pode fazer um escudo elemental ao mesmo tempo que usa um feixe.']}
];
var HOUSES={'Grifinória':['#c0392b','#fff'],'Corvinal':['#3b6fc4','#fff'],'Sonserina':['#2e8b57','#fff'],'Lufa-Lufa':['#d4a017','#1a1a1a']};
var PER=['Feitiços','Poções','Criaturas Mágicas','Reflexos mágicos','Vontade Inabalável'],ATR=['Resistência','Percepção','Lábia','Empatia'];
var KEY='ficha-rpg-completa-v1',TXT=['nome','sobrenome','idade','pais','animal','historia'];
function blank(){var s={hp:100,sh:100,linhagem:'',casa:'',pericia:'',atributo:'',xp:{},ex:{atq:0,def:0,spl:0,pot:0,anm:0,lba:0,pcp:0},amigos:[]};TXT.forEach(function(k){s[k]=''});CATS.forEach(function(c){s.xp[c.id]=0});return s}
var S=blank();
function $(i){return document.getElementById(i)}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r),b=blank();for(var k in b){if(k==='xp'){CATS.forEach(function(c){var v=o.xp&&o.xp[c.id];if(typeof v==='number'&&v>=0)S.xp[c.id]=Math.floor(v)})}else if(k in o&&typeof o[k]===typeof b[k])S[k]=o[k]}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cl(v,a,b){return Math.max(a,Math.min(b,v))}
function nivel(x){return x>=180?3:x>=75?2:x>=25?1:0}
function note(t){$('msg').textContent=t;clearTimeout(note.t);note.t=setTimeout(function(){$('msg').textContent=''},3500)}

/* abas */
function tab(n){for(var i=0;i<4;i++){$('t'+i).setAttribute('aria-selected',i===n);$('p'+i).hidden=i!==n}}
[0,1,2,3].forEach(function(i){$('t'+i).addEventListener('click',function(){tab(i)})});

/* barras */
function bars(){$('hptxt').textContent=S.hp+' / 100';$('hpfill').style.width=S.hp+'%';$('shtxt').textContent=S.sh+' / 100';$('shfill').style.width=S.sh+'%'}
document.querySelectorAll('.vr').forEach(function(c){var inp=c.querySelector('input');c.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var v=parseInt(inp.value,10);if(!(v>0)){inp.focus();return}var k=c.dataset.bar;S[k]=cl(S[k]+v*parseInt(b.dataset.m,10),0,100);if(k==='hp'&&b.dataset.m==='-1'&&S.atributo==='Resistência')S.sh=cl(S.sh+10,0,100);inp.value='';bars();save()})});

/* personagem */
function chips(id,list){var h='';list.forEach(function(t,i){h+='<span><input type="radio" name="'+id+'" id="'+id+i+'" value="'+t+'"><label for="'+id+i+'">'+t+'</label></span>'});$(id).innerHTML=h;$(id).addEventListener('change',function(e){S[id]=e.target.value;save();stats();retryUI();paintFs()})}
chips('pericia',PER);chips('atributo',ATR);
TXT.forEach(function(k){$(k).addEventListener('input',function(){S[k]=$(k).value;save()})});
['linhagem','casa'].forEach(function(k){$(k).addEventListener('change',function(){S[k]=$(k).value;save();theme();stats()})});
function theme(){var h=HOUSES[S.casa]||['#7a5bd0','#fff'],r=document.documentElement.style;r.setProperty('--accent',h[0]);r.setProperty('--on',h[1]);$('title').textContent=S.casa?'Ficha · '+S.casa:'Ficha RPG'}

/* progressão */
function buildCats(){var h='';CATS.forEach(function(c){
h+='<section class="card cat" id="c-'+c.id+'" style="--c:'+c.cor+'"><div class="top"><h2>'+c.nome+'</h2><span class="xp"><span class="badge"></span> · <span class="xpn"></span> XP</span></div><p class="next"></p><div class="segs">';
for(var i=0;i<4;i++)h+='<div class="seg"><div class="t"><div class="f"></div></div><small>'+NIV[i]+'<br>'+FAIXA[i]+'</small></div>';
h+='</div><div class="ctl" data-id="'+c.id+'"><button type="button" class="minus" data-d="-1" aria-label="Remover 1 XP">−1</button><button type="button" data-d="1">+1</button><button type="button" data-d="5">+5</button><button type="button" data-d="10">+10</button></div>';
for(var j=0;j<4;j++)h+='<div class="lv"><h3></h3><p>'+c.n[j]+'</p></div>';h+='</section>'});$('cats').innerHTML=h}
function paintCat(c){var x=S.xp[c.id],n=nivel(x),el=$('c-'+c.id),f=[cl(x/25,0,1),cl((x-25)/50,0,1),cl((x-75)/105,0,1),x>=180?1:0];
el.querySelector('.badge').textContent=NIV[n];el.querySelector('.xpn').textContent=x;
el.querySelector('.next').textContent=n<3?'Faltam '+(LIM[n]-x)+' XP para '+NIV[n+1]+'.':'Maestria máxima alcançada.';
el.querySelectorAll('.seg').forEach(function(s,i){s.querySelector('.f').style.width=(f[i]*100)+'%';s.classList.toggle('on',i===n)});
el.querySelectorAll('.lv').forEach(function(l,i){l.className='lv '+(i<=n?'open':'lock')+(i===n?' cur':'');l.querySelector('h3').textContent='Nível '+(i+1)+' – '+NIV[i]+(i>n?' (bloqueado)':'')})}
$('cats').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var id=b.parentNode.dataset.id,c=CATS.filter(function(k){return k.id===id})[0],a=nivel(S.xp[id]);
S.xp[id]=Math.max(0,S.xp[id]+parseInt(b.dataset.d,10));paintCat(c);save();stats();if(nivel(S.xp[id])>a)alert(c.nome+': subiu para '+NIV[nivel(S.xp[id])]+'!')});

/* combate */
var HIT=[5,3,2,2],BLK=[10,8,6,6],DGE=[0,1,2,3],SHD=['—','25','50','100'],POTO=[10,8,7,7],POTB=[6,6,4,4];
function atq(){return(S.casa==='Sonserina'||S.casa==='Grifinória'?2:0)+S.ex.atq}
function def(){return(S.casa==='Lufa-Lufa'||S.casa==='Corvinal'?2:0)+(S.pericia==='Reflexos mágicos'?2:0)+S.ex.def}
function lvO(){return nivel(S.xp.ofe)}function lvD(){return nivel(S.xp.def)}
function spl(){return nivel(S.xp.ofe)+(S.pericia==='Feitiços'?2:0)+S.ex.spl}function pot(){return nivel(S.xp.poc)+(S.pericia==='Poções'?2:0)+S.ex.pot}
function anm(){return(S.pericia==='Criaturas Mágicas'?3:0)+S.ex.anm}function lba(){return(S.atributo==='Lábia'?3:0)+S.ex.lba}function pcp(){return(S.atributo==='Percepção'?3:0)+S.ex.pcp}
var LAST='',USED=false,RE=false;
function stats(){var o=lvO(),d=lvD();



$('ofeinfo').textContent=NIV[o]+': acerta com '+HIT[o]+'+ · SPL +'+spl()+(o===3?' · dano ×1,5':'');
$('definfo').textContent=NIV[d]+': contra-ataque com '+BLK[d]+'+ · esquiva +'+DGE[d]+' · escudo ativo '+SHD[d]+(d===3?' · contra-ataque +25% de dano':'');var p=nivel(S.xp.poc);$('pocinfo').textContent=NIV[p]+': ótima com '+POTO[p]+'+ · boa com '+POTB[p]+'+'+(p===3?' · ótima com efeito dobrado':'');attrs()}
function attrs(){var h='';[['atq','ATQ','Ataque',atq()],['def','DEF','Defesa',def()],['spl','SPL','Feitiços',spl()],['pot','POT','Poções',pot()],['anm','ANM','Criaturas',anm()],['lba','LBA','Lábia',lba()],['pcp','PCP','Percepção',pcp()]].forEach(function(r){var e=S.ex[r[0]];h+='<div class="stat"><small>'+r[1]+'</small><b>'+(r[3]>0?'+':'')+r[3]+'</b><small>'+r[2]+(e?' · extra '+(e>0?'+':'')+e:'')+'</small><div class="xb" data-k="'+r[0]+'"><button type="button" data-d="-1" aria-label="Diminuir extra de '+r[1]+'">−</button><button type="button" data-d="1" aria-label="Aumentar extra de '+r[1]+'">+</button></div></div>'});$('attrs').innerHTML=h}
function d(n){return Math.floor(Math.random()*n)+1}
function out(title,main,detail,cls){if(RE)title+=' · 2ª tentativa';var h='<b>'+title+'</b><br><span class="big">'+main+'</span><br><span>'+detail+'</span>';
$('res').innerHTML=h;var li=document.createElement('li');li.innerHTML='<b>'+title+'</b> — '+main+' <span style="color:var(--muted)">('+detail+')</span>';
var lg=$('log');lg.insertBefore(li,lg.firstChild);while(lg.children.length>25)lg.removeChild(lg.lastChild)}
function verdict(t,min,okTxt,noTxt){return t>=min?'<span class="ok">'+okTxt+'</span>':'<span class="no">'+noTxt+'</span>'}
function act(a){if(!RE){LAST=a;USED=false}var r,t,A=atq(),D=def(),o=lvO(),dv=lvD();
if(a==='hit'){r=d(10);t=r+A;out('Acertar feitiço',t,'d10 ('+r+') + ATQ ('+A+') · precisa '+HIT[o]+'+ · '+verdict(t,HIT[o],'ACERTOU','ERROU'))}
else if(a==='dmg'){r=d(10);var sp=spl();t=r+sp;var f=o===3?Math.floor(t*1.5):t;out('Dano do feitiço',f,'d10 ('+r+') + SPL ('+sp+') = '+t+(o===3?' × 1,5 (Mestre)':'')+(r>=9?' · <span class="ok">CRÍTICO!</span>':''))}
else if(a==='pot'){r=d(10);var pp=nivel(S.xp.poc),pb=pot();t=r+pb;out('Criar poção',t,'d10 ('+r+') + POT ('+pb+') · ótima '+POTO[pp]+'+ / boa '+POTB[pp]+'+ · '+(t>=POTO[pp]?'<span class="ok">ÓTIMA</span>'+(pp===3?' (efeito dobrado)':' (+1 turno de efeito)'):t>=POTB[pp]?'<span class="ok">BOA</span>':'<span class="no">FALHOU</span>'))}
else if(a==='blk'){r=d(10);t=r+D;out('Bloquear',t,'d10 ('+r+') + DEF ('+D+')')}
else if(a==='ctr'){r=d(10);t=r+D;var ok=t>=BLK[dv],g=dv===3?Math.floor(t*1.25):t;out('Contra-ataque',t,'d10 ('+r+') + DEF ('+D+') · precisa '+BLK[dv]+'+ · '+(ok?'<span class="ok">CONTRA-ATACOU</span> · dano '+g+(dv===3?' (× 1,25 Mestre)':''):'<span class="no">FALHOU</span>'))}
else if(a==='dge'){r=d(10);t=r+D+DGE[dv];out('Desviar',t,'d10 ('+r+') + DEF ('+D+') + esquiva ('+DGE[dv]+')')}
else if(a==='conv'){r=d(10);var L=lba();t=r+L;out('Teste de convencimento',t,'d10 ('+r+') + LBA ('+L+')')}
else if(a==='perc'){r=d(10);var P=pcp();t=r+P;out('Teste de percepção',t,'d10 ('+r+') + PCP ('+P+')')}
else if(a==='free'){var q=cl(parseInt($('fq').value,10)||1,1,50),fc=cl(parseInt($('ff').value,10)||2,2,1000),m=parseInt($('fm').value,10)||0,rs=[],s=0;
for(var i=0;i<q;i++){var x=d(fc);rs.push(x);s+=x}out('Dado livre '+q+'d'+fc+(m?(m>0?'+':'')+m:''),s+m,'['+rs.join(', ')+']'+(m?' '+(m>0?'+':'−')+' '+Math.abs(m):''))}}
document.querySelectorAll('[data-a]').forEach(function(b){b.addEventListener('click',function(){RE=false;act(b.dataset.a);retryUI()})});

function retryUI(){$('retry').hidden=!(S.pericia==='Vontade Inabalável'&&LAST&&!USED)}
$('retry').addEventListener('click',function(){USED=true;RE=true;act(LAST);RE=false;retryUI()});
var pr='';[4,6,8,10,12,20,100].forEach(function(n){pr+='<span><button type="button" class="small" data-f="'+n+'">d'+n+'</button></span>'});$('presets').innerHTML=pr;
$('presets').addEventListener('click',function(e){var b=e.target.closest('button');if(b)$('ff').value=b.dataset.f});
$('clog').addEventListener('click',function(){$('log').innerHTML='';$('res').textContent='Faça uma rolagem.'});

/* extras */
$('copy').addEventListener('click',function(){var t='Ficha de '+S.nome+' '+S.sobrenome+'\nIdade: '+S.idade+'\nPaís de origem: '+S.pais+'\nLinhagem: '+S.linhagem+'\nAnimal: '+S.animal+'\nCasa: '+S.casa+'\nPerícia: '+S.pericia+'\nAtributo: '+S.atributo+'\nVida: '+S.hp+'/100\nEscudo: '+S.sh+'/100\nATQ: '+atq()+' · DEF: '+def()+' · SPL: '+spl()+' · POT: '+pot()+'\n';
CATS.forEach(function(c){t+=c.nome+': '+NIV[nivel(S.xp[c.id])]+' ('+S.xp[c.id]+' XP)\n'});t+='\nHistória:\n'+S.historia;
try{navigator.clipboard.writeText(t).then(function(){note('Ficha copiada.')},function(){note('Não foi possível copiar.')})}catch(e){note('Não foi possível copiar.')}});
$('reset').addEventListener('click',function(){if(!confirm('Apagar todos os dados da ficha, inclusive XP e amizades?'))return;S=blank();save();paintAll();note('Ficha limpa.')});

function paintAll(){TXT.forEach(function(k){$(k).value=S[k]});$('linhagem').value=S.linhagem;$('casa').value=S.casa;
[['pericia',PER],['atributo',ATR]].forEach(function(p){p[1].forEach(function(t,i){$(p[0]+i).checked=S[p[0]]===t})});
bars();theme();CATS.forEach(paintCat);stats();retryUI();renderF()}
/* extras */
$('attrs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var k=b.parentNode.dataset.k;S.ex[k]=cl(S.ex[k]+parseInt(b.dataset.d,10),-20,20);save();stats()});
$('zex').addEventListener('click',function(){for(var k in S.ex)S.ex[k]=0;save();stats()});

/* amizades */
var FNIV=['Colegas','Amigos','Melhores amigos','Namorados'],FFAIXA=['0–24','25–74','75–149','150+'],FLIM=[25,75,150];
var FTXT=['Vocês podem chamar para missões.','Podem chamar para atividades de lazer.','Podem tomar cerveja amanteigada. Podem fazer ataques coordenados. Se o aliado cair exausto, o outro pode levá-lo. Ganha 1/4 de dano adicional no ataque coordenado.','Ganha 1/2 de dano adicional no ataque coordenado.'];
var FACT=[['Ajudar em situações simples',3],['Conversa amistosa',5],['Ajudar em confrontos',7],['Chamar para missões',9],['Chamar para lazer',15],['Tomar cerveja amanteigada',30],['Chamar para par em eventos',50]];
var FNEG=[['Desrespeitar',10],['Tratar mal',20],['Decepcionar',30],['Trair',100]];
function fniv(x){return x>=150?3:x>=75?2:x>=25?1:0}
function fm(){return S.atributo==='Empatia'?2:1}
function fix(){if(!S.ex||typeof S.ex!=='object')S.ex={};['atq','def','spl','pot','anm','lba','pcp'].forEach(function(k){var v=S.ex[k];S.ex[k]=typeof v==='number'&&isFinite(v)?Math.round(v):0});
if(!Array.isArray(S.amigos))S.amigos=[];S.amigos=S.amigos.filter(function(f){return f&&f.id&&typeof f.nome==='string'&&typeof f.cp==='number'&&f.cp>=0}).map(function(f){return{id:String(f.id),nome:f.nome.slice(0,40),cp:Math.floor(f.cp),prev:typeof f.prev==='number'?f.prev:null}})}
function renderF(){var h='';S.amigos.forEach(function(f){
h+='<section class="card cat fc" id="f-'+f.id+'" style="--c:var(--accent)"><div class="top"><h2></h2><span class="xp"><span class="badge"></span> · <span class="xpn"></span> cp</span></div><p class="next"></p><div class="segs">';
for(var i=0;i<4;i++)h+='<div class="seg"><div class="t"><div class="f"></div></div><small>'+FNIV[i]+'<br>'+FFAIXA[i]+'</small></div>';
h+='</div><div class="ac">';FACT.forEach(function(a,i){h+='<button type="button" data-i="'+i+'"></button>'});
h+='</div><div class="ac neg">';FNEG.forEach(function(a,i){h+='<button type="button" data-n="'+i+'"></button>'});h+='</div><div class="fr fx"><input type="number" min="1" inputmode="numeric" placeholder="Pontos (cp)" aria-label="Pontos livres de amizade"><button type="button" data-op="sub">Tirar cp</button><button type="button" data-op="add">Adicionar cp</button></div><p class="ct"></p><div class="fo"><button type="button" data-op="undo">Desfazer último</button><button type="button" data-op="del">Remover</button></div><details><summary>Ver níveis</summary>';
for(var j=0;j<4;j++)h+='<div class="lv"><h3></h3><p>'+FTXT[j]+'</p></div>';h+='</details></section>'});
$('fl').innerHTML=h||'<p class="hint">Nenhum personagem ainda.</p>';S.amigos.forEach(paintF)}
function paintF(f){var el=$('f-'+f.id);if(!el)return;var x=f.cp,n=fniv(x),fl=[cl(x/25,0,1),cl((x-25)/50,0,1),cl((x-75)/75,0,1),x>=150?1:0];
el.querySelector('h2').textContent=f.nome;el.querySelector('.badge').textContent=FNIV[n];el.querySelector('.xpn').textContent=x;
el.querySelector('.next').textContent=n<3?'Faltam '+(FLIM[n]-x)+' cp para '+FNIV[n+1]+'.':'Nível máximo de amizade.';
el.querySelector('.ct').textContent=FTXT[n];
el.querySelectorAll('.seg').forEach(function(s,i){s.querySelector('.f').style.width=(fl[i]*100)+'%';s.classList.toggle('on',i===n)});
el.querySelectorAll('.ac:not(.neg) button').forEach(function(b,i){b.textContent=FACT[i][0]+' · +'+FACT[i][1]*fm()+' cp'});el.querySelectorAll('.neg button').forEach(function(b,i){b.textContent=FNEG[i][0]+' · −'+FNEG[i][1]+' cp'});
el.querySelectorAll('.lv').forEach(function(l,i){l.className='lv '+(i<=n?'open':'lock')+(i===n?' cur':'');l.querySelector('h3').textContent='Nível '+(i+1)+' – '+FNIV[i]+(i>n?' (bloqueado)':'')})}
function paintFs(){S.amigos.forEach(paintF)}
function addF(){var n=$('fnome').value.trim();if(!n)return;S.amigos.push({id:Date.now()+''+Math.floor(Math.random()*1000),nome:n.slice(0,40),cp:0,prev:null});$('fnome').value='';save();renderF()}
$('fadd').addEventListener('click',addF);
$('fnome').addEventListener('keydown',function(e){if(e.key==='Enter')addF()});
$('fl').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var sec=b.closest('.fc');if(!sec)return;
var f=S.amigos.filter(function(x){return 'f-'+x.id===sec.id})[0];if(!f)return;
if(b.dataset.i!==undefined){var g=FACT[+b.dataset.i][1]*fm(),old=fniv(f.cp);f.prev=f.cp;f.cp+=g;paintF(f);save();if(fniv(f.cp)>old)alert(f.nome+': agora são '+FNIV[fniv(f.cp)]+'!')}
else if(b.dataset.n!==undefined){f.prev=f.cp;f.cp=Math.max(0,f.cp-FNEG[+b.dataset.n][1]);paintF(f);save()}
else if(b.dataset.op==='add'||b.dataset.op==='sub'){var inp=sec.querySelector('.fx input'),v=parseInt(inp.value,10);if(!(v>0)){inp.focus();return}var o2=fniv(f.cp);f.prev=f.cp;f.cp=Math.max(0,f.cp+(b.dataset.op==='add'?v:-v));inp.value='';paintF(f);save();if(fniv(f.cp)>o2)alert(f.nome+': agora são '+FNIV[fniv(f.cp)]+'!')}
else if(b.dataset.op==='undo'){if(typeof f.prev==='number'){f.cp=f.prev;f.prev=null;paintF(f);save()}}
else if(b.dataset.op==='del'){if(confirm('Remover '+f.nome+'?')){S.amigos=S.amigos.filter(function(x){return x!==f});save();renderF()}}});
buildCats();load();fix();paintAll();
</script>
